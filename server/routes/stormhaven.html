<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🛡 Stormhaven Mission Control</title>
<style>
  :root {
    --bg: #0a0e14;
    --panel: #0f141b;
    --panel-2: #131922;
    --border: #1f2733;
    --text: #d7dce3;
    --muted: #6b7280;
    --green: #10b981;
    --yellow: #f59e0b;
    --red: #ef4444;
    --blue: #3b82f6;
    --teal: #14b8a6;
    --accent: #8b5cf6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.4;
    padding: 16px;
  }
  h1 { margin: 0 0 4px; font-size: 20px; font-weight: 700; }
  h2.panel-title { margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
  .grid { display: grid; gap: 12px; }
  .grid-2 { grid-template-columns: 1fr 1fr; }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  .meta { color: var(--muted); font-size: 12px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }

  /* Status banner */
  .banner { padding: 14px 16px; border-radius: 8px; border: 1px solid var(--border); }
  .banner.GREEN  { background: linear-gradient(180deg, rgba(16,185,129,.15), rgba(16,185,129,.04)); border-color: rgba(16,185,129,.3); }
  .banner.YELLOW { background: linear-gradient(180deg, rgba(245,158,11,.15), rgba(245,158,11,.04)); border-color: rgba(245,158,11,.3); }
  .banner.RED    { background: linear-gradient(180deg, rgba(239,68,68,.18),  rgba(239,68,68,.04)); border-color: rgba(239,68,68,.4);  }
  .status-word { font-weight: 800; letter-spacing: 0.05em; font-size: 22px; }
  .GREEN .status-word { color: var(--green); }
  .YELLOW .status-word { color: var(--yellow); }
  .RED .status-word { color: var(--red); }
  .cost-strip { font-size: 13px; }
  .cost-strip .num { font-weight: 700; color: var(--text); }
  .cost-strip .lab { color: var(--muted); margin-right: 4px; }
  .over-budget { color: var(--red); font-weight: 700; }

  /* Disks */
  .disk-card { padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); position: relative; overflow: hidden; }
  .disk-card.GREEN  { border-left: 4px solid var(--green); }
  .disk-card.YELLOW { border-left: 4px solid var(--yellow); }
  .disk-card.RED    { border-left: 4px solid var(--red); }
  .disk-pct { font-size: 22px; font-weight: 800; }
  .disk-bar { height: 6px; border-radius: 999px; background: rgba(255,255,255,.06); margin: 8px 0; overflow: hidden; }
  .disk-bar-fill { height: 100%; border-radius: 999px; }
  .disk-bar-fill.GREEN  { background: var(--green); }
  .disk-bar-fill.YELLOW { background: var(--yellow); }
  .disk-bar-fill.RED    { background: var(--red); }
  .trend-pending { color: var(--muted); font-style: italic; }

  /* ARR table */
  table.arr { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.arr th { text-align: left; padding: 6px 6px; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); border-bottom: 1px solid var(--border); }
  table.arr td { padding: 7px 6px; border-bottom: 1px solid rgba(255,255,255,.04); }
  table.arr td.num, table.arr th.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.arr tr.unhealthy td { color: var(--yellow); }
  table.arr tr.unhealthy td:first-child::before { content: "⚠ "; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill.GREEN  { background: rgba(16,185,129,.15); color: var(--green); }
  .pill.YELLOW { background: rgba(245,158,11,.15); color: var(--yellow); }
  .pill.RED    { background: rgba(239,68,68,.18);  color: var(--red); }

  /* Containers */
  .container-wrap { position: relative; }
  .container-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; position: relative; z-index: 1; }
  .container { padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel-2); position: relative; transition: border-color .2s; }
  .container .name { font-size: 12px; font-weight: 600; }
  .container .pin { font-size: 11px; opacity: .6; cursor: help; }
  .state-running { color: var(--green); font-size: 11px; }
  .state-exited { color: var(--red); font-size: 11px; }
  .state-other { color: var(--yellow); font-size: 11px; }
  .container.dangling { border: 1px solid var(--red); animation: pulse 2s infinite; }
  .container[data-name="gluetun"] { border-color: var(--teal); }
  .dependency-line { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 2; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,.5); }
    50% { box-shadow: 0 0 0 4px rgba(239,68,68,0); }
  }
  .transcode-chip { display: inline-block; margin-left: 4px; font-size: 10px; padding: 1px 4px; background: rgba(245,158,11,.2); color: var(--yellow); border-radius: 3px; }

  /* Hestia health dots */
  .health-dots { display: flex; flex-wrap: wrap; gap: 2px; padding: 4px 0; }
  .health-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); cursor: pointer; transition: transform .1s; }
  .health-dot:hover { transform: scale(1.6); }
  .health-dot.GREEN  { background: var(--green); }
  .health-dot.YELLOW { background: var(--yellow); }
  .health-dot.RED    { background: var(--red); }

  /* Morning briefs - 7 horizontal cards */
  .briefs-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 8px; }
  .brief-card { padding: 8px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; min-height: 76px; cursor: pointer; transition: border-color .15s; }
  .brief-card:hover { border-color: var(--accent); }
  .brief-card .date { font-size: 11px; font-weight: 600; color: var(--text); }
  .brief-card .cost { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .brief-card .snip { font-size: 10px; color: var(--muted); margin-top: 4px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .brief-card.empty { background: transparent; border-style: dashed; }

  /* Setup gaps */
  ul.gaps { list-style: none; padding: 0; margin: 0; }
  ul.gaps li { display: flex; gap: 8px; padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,.04); align-items: flex-start; }
  ul.gaps li:last-child { border-bottom: none; }
  .gap-dot { flex: 0 0 8px; width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; }
  .gap-dot.warn { background: var(--yellow); }
  .gap-dot.info { background: var(--blue); }
  .gap-dot.error { background: var(--red); }
  .gap-body { flex: 1 1 auto; }
  .gap-actions { display: flex; gap: 8px; margin-top: 4px; font-size: 11px; }
  .gap-actions a, .gap-actions button { color: var(--blue); background: none; border: none; padding: 0; cursor: pointer; font-family: inherit; font-size: inherit; text-decoration: none; }
  .gap-actions a:hover, .gap-actions button:hover { text-decoration: underline; }

  /* Cost trend */
  .cost-trend-wrap { width: 100%; height: 180px; position: relative; }
  .cost-trend-wrap svg { width: 100%; height: 100%; display: block; }
  .legend { display: flex; gap: 12px; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .legend .swatch { display: inline-block; width: 10px; height: 2px; vertical-align: middle; margin-right: 4px; }

  /* Quick facts */
  pre.quick-facts {
    white-space: pre-wrap;
    margin: 0;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    color: var(--text);
    background: var(--panel-2);
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    max-height: 320px;
    overflow: auto;
  }

  /* Status bar */
  #status-bar { position: fixed; top: 8px; right: 16px; font-size: 11px; opacity: .65; padding: 3px 9px; border-radius: 4px; background: var(--panel); border: 1px solid var(--border); z-index: 100; }
  #status-bar.stale { color: var(--red); opacity: 1; }
  #status-bar.connected::before { content: "●  "; color: var(--green); }
  #status-bar.connecting::before { content: "○  "; color: var(--yellow); }
  #status-bar.stale::before { content: "⚠ "; color: var(--red); }

  /* Modal */
  .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
  .modal-back.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; max-width: 720px; width: 100%; max-height: 80vh; display: flex; flex-direction: column; }
  .modal-head { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal-head h3 { margin: 0; font-size: 14px; }
  .modal-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; }
  .modal-body { padding: 14px 16px; overflow: auto; }
  .modal-body pre { white-space: pre-wrap; margin: 0; font-family: ui-monospace, "SF Mono", monospace; font-size: 12px; color: var(--text); }

  /* Mobile priority-order layout */
  @media (max-width: 700px) {
    body { padding: 10px; }
    .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
    .briefs-row { grid-template-columns: repeat(3, 1fr); grid-auto-rows: minmax(72px, auto); }
    /* spec §4.5 lines 917-925 — single-column priority order */
    .layout-grid { display: flex; flex-direction: column; gap: 12px; }
    .layout-grid > * { order: 99; }
    #header           { order: 1; }
    #setup-gaps       { order: 2; }
    #disks-panel      { order: 3; }
    #arr              { order: 4; }
    #recent-runs      { order: 5; }
    #containers       { order: 6; }
    #cost-trend       { order: 7; }
    #quick-facts      { order: 8; }
  }
</style>
</head>
<body>
<div id="status-bar" class="connecting">connecting</div>
<div class="layout-grid">
  <h1>🛡 Stormhaven Mission Control</h1>
  <div id="header"></div>
  <div id="setup-gaps" class="panel"></div>
  <div id="disks-panel" class="panel">
    <h2 class="panel-title">Disk usage + 24h trend</h2>
    <div class="grid grid-3" id="disks"></div>
  </div>
  <div class="grid grid-2">
    <div class="panel" id="arr"></div>
    <div class="panel" id="recent-runs"></div>
  </div>
  <div class="panel container-wrap" id="containers"></div>
  <div class="panel" id="cost-trend"></div>
  <div class="panel" id="quick-facts"></div>
</div>

<div class="modal-back" id="modal" onclick="if(event.target===this){this.classList.remove('open')}">
  <div class="modal">
    <div class="modal-head"><h3 id="modal-title"></h3><button class="modal-close" onclick="document.getElementById('modal').classList.remove('open')">×</button></div>
    <div class="modal-body"><pre id="modal-body"></pre></div>
  </div>
</div>

<script src="/stormhaven-dashboard.js?v=1777787829"></script>
</body>
</html>
